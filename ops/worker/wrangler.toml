name = "igrs-preview-worker"
main = "worker.ts"
compatibility_date = "2026-04-11"

[vars]
SITE_ORIGIN = "https://igrs.madeby.my.id"

[[routes]]
pattern = "igrs.madeby.my.id/game/*"
zone_name = "madeby.my.id"

[[routes]]
pattern = "igrs.madeby.my.id/proxy/steam/*"
zone_name = "madeby.my.id"

# Staging environment — deploy with: wrangler deploy --env staging
[env.staging]
name = "igrs-preview-worker-staging"

[env.staging.vars]
SITE_ORIGIN = "https://staging-igrs.madeby.my.id"

[[env.staging.routes]]
pattern = "staging-igrs.madeby.my.id/game/*"
zone_name = "madeby.my.id"

[[env.staging.routes]]
pattern = "staging-igrs.madeby.my.id/proxy/steam/*"
zone_name = "madeby.my.id"
